name: Cap nhat bao cao MTCL2026 hang ngay

on:
  schedule:
    # 02:00 UTC = 09:00 gio Viet Nam (UTC+7). Chay moi ngay.
    - cron: '0 2 * * *'
  workflow_dispatch:        # cho phep bam chay thu cong tren GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# chi cho phep 1 lan deploy tai 1 thoi diem
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cai trinh duyet Playwright
        run: python -m playwright install --with-deps chromium

      - name: Lay du lieu & dung trang tinh
        env:
          SMARTF_USER: ${{ secrets.SMARTF_USER }}
          SMARTF_PASS: ${{ secrets.SMARTF_PASS }}
          PROVINCE: ${{ vars.PROVINCE }}
          SHEET_URL: ${{ vars.SHEET_URL }}
        run: python build_static.py

      - name: Upload trang tinh
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy len GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
